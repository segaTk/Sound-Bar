[package]
name = "guitara-sound-mod"
version = "0.1.0"
edition = "2021"
authors = ["Sergey Naumenko"]
license = "GNU Affero General License v3.0 (AGPL-3.0)"
description = "Guitar learning game with real-time pitch detection"

[dependencies]
rodio = "0.17"

macroquad = "0.4"
cpal = "0.15"
chrono = "0.4"
rustfft = "6.1"
num-complex = "0.4"

midly = "0.5"
#ndarray = "0.15"
rand = "0.8"

quick-xml = { version = "0.36", features = ["encoding"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "2.2"
rfd = "0.15"

#lameenc = "1.7" # Для записи MP3

[profile.release]
opt-level = 3
lto = true
strip = true        # Удаляет символы (имена функций/переменных)
codegen-units = 1   # Улучшает LTO
panic = "abort" 

