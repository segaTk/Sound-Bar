# x=0.0 — левый край, x=1.0 — правый; y=0.0 — верх, y=1.0 — низ.


[[sections]]
heading = "Что это"
body    = "Sound Bar — интерактивный тренажёр для гитары.\nНоты летят справа налево, вы играете на реальной гитаре или пиано — микрофон определяет тон и засчитывает попадания."
  [[images]]
  path  = "locales/img/image.png"
  x     = 0.43 # вправо
  y     = 0.10 #
  w     = 0.55 #
  alpha = 1.0


 

[[sections]]
heading = "Как начать"
body    = "1. Подключите гитару пианино или убедитесь что микрофон слышит ноты.\n2. Выберите песню из списка.\n3. Нажмите M для выбора микрофона если нужно.\n4. Играйте!"





[[sections]]
heading = "Управление в игре"
body    = "M — микрофон\nT — тюнер\nS / W — скорость (−/+)\nP — пауза\nZ — авто-проигрывание\nR — запись\nO — аудиовыход\n<- -> перемотка времени\nN — заново\nEsc — статистика / выход"









[[sections]]
heading = "Уроки"
body    = "Раздел Уроки — интерактивные уроки с шагами.\nРаздел База — теоретический справочник.\nВ шагах уроков можно нажимать ссылки для перехода в Тюнер или Практику."






