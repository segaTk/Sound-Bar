section_title = "Музыкальная теория"

[[lessons]]
id          = "notes"
title       = "Ноты и нотный стан"
description = "Как читать ноты: скрипичный ключ, октавы, длительности"
image       = "theory/img/notes_staff.png"

  [[lessons.steps]]
  text = "Нотный стан состоит из 5 линий. Ноты располагаются на линиях и между ними. Скрипичный ключ (свиток в начале) указывает, что нижняя линия — нота Ми первой октавы (E4)."

    [[lessons.steps.images]]
    path    = "theory/img/notes_staff.png"
    x       = 0.54
    y       = 0.16
    w       = 0.40
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "Семь нотных названий: До (C) — Ре (D) — Ми (E) — Фа (F) — Соль (G) — Ля (A) — Си (B). После Си снова идёт До, но на октаву выше."

  [[lessons.steps]]
  text = "Длительности нот:\n  Целая        = 4 удара\n  Половинная  = 2 удара\n  Четвертная  = 1 удар\n  Восьмая     = ½ удара\n  Шестнадцатая = ¼ удара"

[[lessons]]
id          = "intervals"
title       = "Интервалы"
description = "Расстояния между нотами: полутоны, тоны, основные интервалы"
image       = "theory/img/intervals.png"

  [[lessons.steps]]
  text = "Интервал — расстояние между двумя нотами. Наименьший интервал в западной музыке — полутон (один лад на гитаре). Два полутона = один тон."

    [[lessons.steps.images]]
    path    = "theory/img/intervals.png"
    x       = 0.55
    y       = 0.15
    w       = 0.38
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "Основные интервалы от ноты C:\n  Прима     = C–C  (0 полутонов)\n  Секунда   = C–D  (2)\n  Терция    = C–E  (4)\n  Кварта    = C–F  (5)\n  Квинта    = C–G  (7)\n  Секста    = C–A  (9)\n  Септима   = C–B  (11)\n  Октава    = C–C' (12)"

  [[lessons.steps]]
  text = "На гитаре: каждый лад = 1 полутон. Значит квинта (7 полутонов) от открытой 6-й струны (E2) — нота H (B2) на 7-м ладу той же струны."

[[lessons]]
id          = "chords_theory"
title       = "Строение аккордов"
description = "Трезвучия мажор/минор, септаккорды, обращения"
image       = "theory/img/chords_theory.png"

  [[lessons.steps]]
  text = "Аккорд — три и более ноты, звучащие одновременно. Трезвучие строится по терциям: основная нота + большая терция + малая терция = мажор."

    [[lessons.steps.images]]
    path    = "theory/img/chords_theory.png"
    x       = 0.55
    y       = 0.14
    w       = 0.38
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "Мажорное трезвучие C (до мажор): C – E – G (полутоны: +4, +3).\nМинорное трезвучие Am (ля минор): A – C – E (полутоны: +3, +4).\nРазница — в порядке терций."

  [[lessons.steps]]
  text = "Септаккорд = трезвучие + ещё одна терция. Доминантовый септаккорд G7: G – B – D – F (полутоны: +4, +3, +3). Создаёт напряжение, требующее разрешения."

[[lessons]]
id          = "rhythm"
title       = "Ритм и метр"
description = "Такты, доли, размеры 4/4 и 3/4"

  [[lessons.steps]]
  text = "Метр — повторяющаяся пульсация. Такт делится на равные доли. Размер 4/4 означает: 4 четвертные ноты в такте. Это самый распространённый размер в рок, поп и джазе."

  [[lessons.steps]]
  text = "Размер 3/4 (вальс): 3 четвертные ноты в такте. Первая доля сильная, остальные слабые. Счёт: РАЗ-два-три, РАЗ-два-три."

  [[lessons.steps]]
  text = "Синкопа — акцент на слабую долю. Вместо «РАЗ-два-ТРИ-четыре» — «раз-ДВА-три-ЧЕТЫРЕ». Широко используется в джазе, фанке и рок-музыке."

