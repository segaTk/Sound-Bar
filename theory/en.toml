section_title = "Уроки игры на гитаре"

# ─── Урок 1 ───────────────────────────────────────────────────────────────────
[[lessons]]
id          = "posture"
title       = "Как держать гитару"
description = "Правильная посадка и положение рук — основа техники"
image       = "lessons/img/posture_sit.png"   # обложка в списке уроков

  [[lessons.steps]]
  text = "Сядьте на стул, держите спину прямо. Гитара кладётся вырезом на правое бедро (для правши). Корпус инструмента слегка наклонён к вам."

    # Картинка справа: фото правильной посадки
    [[lessons.steps.images]]
    path    = "lessons/img/posture_sit.png"
    x       = 0.55      # 55% от ширины экрана — правая половина
    y       = 0.14
    w       = 0.38      # занимает 38% ширины
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "Левая рука охватывает гриф снизу: большой палец — за серединой грифа, остальные — над струнами. Запястье не должно касаться нижней кромки грифа."

    # Два изображения: общий план + крупный план руки
    [[lessons.steps.images]]
    path    = "lessons/img/posture_sit.png"
    x       = 0.56
    y       = 0.14
    w       = 0.20
    alpha   = 0.60      # полупрозрачный — второстепенный
    z_order = 0

    [[lessons.steps.images]]
    path    = "lessons/img/posture_hand.png"
    x       = 0.57
    y       = 0.38      # чуть ниже первого
    w       = 0.36
    alpha   = 1.0
    z_order = 1         # поверх первого

  [[lessons.steps]]
  text = "Правая рука свободно лежит на деке. Медиатор зажат большим и указательным пальцами под углом 45° к струнам."

    [[lessons.steps.images]]
    path    = "lessons/img/posture_hand.png"
    x       = 0.58
    y       = 0.18
    w       = 0.34
    alpha   = 0.95
    z_order = 0

# ─── Урок 2 ───────────────────────────────────────────────────────────────────
[[lessons]]
id          = "tuning"
title       = "Настройка гитары"
description = "Стандартный строй E A D G B E и как проверить по тюнеру"
image       = "lessons/img/tuning_pegs.png"

  [[lessons.steps]]
  text = "Стандартный строй (от 6-й струны к 1-й): E2 — A2 — D3 — G3 — B3 — E4.\nЗапомните: «Едет Аня Домой, Готовит Борщ Ежедневно»."

    [[lessons.steps.images]]
    path    = "lessons/img/tuning_pegs.png"
    x       = 0.56
    y       = 0.15
    w       = 0.36
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "Откройте тюнер в приложении (кнопка TUNER в меню выбора песен). Зацепите 6-ю (толстую) струну — тюнер должен показать ноту E2 (~82 Гц)."

    [[lessons.steps.images]]
    path    = "lessons/img/tuning_pegs.png"
    x       = 0.60
    y       = 0.20
    w       = 0.28
    alpha   = 0.80
    z_order = 0

  [[lessons.steps]]
  text = "Если стрелка ушла влево — струна занижена, подтяните колок по часовой стрелке. Вправо — ослабьте. Добейтесь центра стрелки."

  [[lessons.steps]]
  text = "Повторите для каждой струны:\n  A2  — 110 Гц\n  D3  — 147 Гц\n  G3  — 196 Гц\n  B3  — 247 Гц\n  E4  — 330 Гц"

    [[lessons.steps.images]]
    path    = "lessons/img/tuning_pegs.png"
    x       = 0.58
    y       = 0.16
    w       = 0.32
    alpha   = 0.90
    z_order = 0

# ─── Урок 3 ───────────────────────────────────────────────────────────────────
[[lessons]]
id          = "first_chords"
title       = "Первые аккорды: Em и Am"
description = "Два самых простых аккорда для начинающих"
image       = "lessons/img/em_chord.png"

  [[lessons.steps]]
  text = "Аккорд Em (ми минор): прижмите 5-ю струну на 2-м ладу средним пальцем, 4-ю струну на 2-м ладу безымянным. Звучат все 6 струн."

    [[lessons.steps.images]]
    path    = "lessons/img/em_chord.png"
    x       = 0.55
    y       = 0.14
    w       = 0.38
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "Аккорд Am (ля минор): 2-ю струну — 1-й лад указательным, 3-ю — 2-й лад средним, 4-ю — 2-й лад безымянным. Звучат струны 1–5, 6-ю не трогаем."

    [[lessons.steps.images]]
    path    = "lessons/img/am_chord.png"
    x       = 0.55
    y       = 0.14
    w       = 0.38
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "Практика: переходите Em → Am → Em несколько раз. Каждая нота должна звучать чисто — никаких «мёртвых» звуков."

    # Оба аккорда рядом для сравнения
    [[lessons.steps.images]]
    path    = "lessons/img/em_chord.png"
    x       = 0.54
    y       = 0.16
    w       = 0.20
    alpha   = 0.95
    z_order = 0

    [[lessons.steps.images]]
    path    = "lessons/img/am_chord.png"
    x       = 0.76
    y       = 0.16
    w       = 0.20
    alpha   = 0.95
    z_order = 0

# ─── Урок 4 ───────────────────────────────────────────────────────────────────
[[lessons]]
id          = "practice_mode"
title       = "Режим Практика"
description = "Как пользоваться игровым режимом приложения"

  [[lessons.steps]]
  text = "Выберите «Практика» в главном меню → выберите песню. Ноты летят справа налево и попадают в зону HIT ZONE."

  [[lessons.steps]]
  text = "Зажмите нужную ноту на гитаре. Микрофон определит вашу частоту и засчитает попадание, если вы сыграли вовремя."

  [[lessons.steps]]
  text = "Клавиши управления:\n  M — выбор микрофона\n  S / W — скорость (−/+)\n  P — пауза\n  Z — авто-проигрывание\n  Esc — статистика"

