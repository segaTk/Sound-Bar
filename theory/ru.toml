# ─── Урок 1 ───────────────────────────────────────────────────────────────────
[[lessons]]
id          = "Table of frequency"
title       = "Таблица частотных диапазонов 88 клавиш фортепиано"
description = "Нотация 88 клавиш фортепианно"
image       = "lessons/img/guitar_transposing.png"

  [[lessons.steps]]
  text = """
  Гитара - транспонирующий инструмент. Она звучит на октаву ниже написанного. Ноты пишутся в скрипичном ключе, но звучат ниже — это сделано для удобства чтения.
  
  Одна нота - несколько мест. Ноту 'Ми' первой октавы можно сыграть в 5 разных местах:\n  • 1-я струна, открытый лад\n  • 2-я струна, 5-й лад\n  • 3-я струна, 9-й лад\n  • 4-я струна, 14-й лад\n  • 5-я струна, 19-й лад
  Пояснения
  """

    [[lessons.steps.images]]
    path    = "lessons/img/guitar_transposing.png"
    x       = 0.55
    y       = 0.14
    w       = 0.38
    alpha   = 1.0
    z_order = 0

  text = """
Структура клавиатуры:
- Диапазон фортепиано: от A0 (27.5 Гц) до C8 (4186 Гц) — чуть более 7 октав.
- Октавы: 7 полных октав (1–7) плюс неполные 0-я (A0–B0) и 8-я (только C8).
- Октava 4 (C4–B4) — «малая» октава в российской традиции, содержит «центральную» ноту C4 (≈261.63 Гц).

Метод расчёта:
- Частота клавиши №n вычисляется по формуле: **f(n) = 440 × 2^((n−49)/12)**
- Границы диапазона каждой ноты — геометрические средние между соседними частотами (множитель **2^(1/24) ≈ 1.0293**).
- Общий диапазон всего инструмента: **≈26.7 Гц — ≈4309 Гц**.

Ориентиры:
"""
  [[lessons.steps.tables]]
  headers = ["№","Нота", "Частота (Гц)", "Описание"]
  align = ["center", "center", "center", "center"]
  rows = [
      ["1","A0", "27.50", "Самая низкая клавиша"],
      ["2","C4", "261.63", "Центральное До"],
      ["3","A4", "440", "Камертон (эталон настройки)"],
      ["4","C8", "4186", "Самая высокая клавиша"],
  ]

  [[lessons.steps]]
  text = """
Основные аккордовые последовательности (прогрессии) для эталонного звучания

Аккордовые прогрессии — это основа гармонии в популярной музыке. Ниже приведены самые распространённые последовательности с примерами песен.

1. I — IV — V — I (Базовая каденция)

Самая фундаментальная последовательность в западной музыке.
Примеры песен:
- «La Bamba» — Ritchie Valens
- «Twist and Shout» — The Beatles
- Множество народных и блюзовых композиций
"""
  [[lessons.steps.tables]]
  headers = ["Тональность","I", "IV", "V","I"]
  align = ["center", "center", "center", "center"]
  rows = [
      ["C (До мажор)","C", "F", "G", "C"],
      ["G (Соль мажор)","G", "C", "D","G"],
      ["D (Ре мажор)","D", "G", "A","D"],
  ]

  [[lessons.steps]]
    text = """
«Поп-прогрессия»
 I — V — VI — IV 
Самая распространённая последовательность в современной поп- и рок-музыке.

Примеры песен:
- «Let It Be» — The Beatles
- «With or Without You» — U2
- «No Woman, No Cry» — Bob Marley
- «Someone Like You» — Adele
- «Demons» — Imagine Dragons
- «I'm Yours» — Jason Mraz

"""
  [[lessons.steps.tables]]
  headers = ["Тональность","I", "V", "VI","IV"]
  align = ["center", "center", "center", "center"]
  rows = [
      ["C (До мажор)","C", "G", "Am", "F"],
      ["G (Соль мажор)","G", "D", "Em","C"],
      ["D (Ре мажор)","D", "A", "Bm","G"],
  ]

  [[lessons.steps]]
    text = """

VI — IV — I — V: Минорная поп-прогрессия

Начинается с минорного аккорда, создаёт более драматичное настроение.
Примеры песен:
- «Africa» — Toto
- «Happy Together» — The Turtles
- «Faded» — Alan Walker
- «Zombie» — The Cranberries
"""

  [[lessons.steps.tables]]
  headers = ["Тональность","VI", "IV", "I","V"]
  align = ["center", "center", "center", "center"]
  rows = [
      ["C (До мажор)","Am", "F", "C", "G"],
      ["G (Соль мажор)","Em", "C", "G","D"],
      ["A (Ля мажор)","F#m", "D", "A","E"],
  ]

  [[lessons.steps]]
    text = """
I — vi — IV — V («Прогрессия 50-х»)

Классическая последовательность для баллад и ду-воп музыки 1950-60-х годов.

**Примеры песен:**
- «Stand By Me» — Ben E. King
- «Every Breath You Take» — The Police
- «All My Loving» — The Beatles
- «Unchained Melody» — The Righteous Brothers
"""

  [[lessons.steps.tables]]
  headers = ["Тональность","I", "VI", "IV","V"]
  align = ["center", "center", "center", "center"]
  rows = [
      ["C (До мажор)","C", "Am", "F", "G"],
      ["G (Соль мажор)","G", "Em", "C","D"],
      ["A (Ля мажор)","A", "F#m", "D","E"],
  ]
  [[lessons.steps]]
    text = """
ii — V — I (Джазовая каденция)

Основа джазовой гармонии, создаёт сильное разрешение.

Примеры песен:
- «Autumn Leaves» (джазовый стандарт)
- «Fly Me to the Moon» — Frank Sinatra
- «Satin Doll» — Duke Ellington
- «Take the 'A' Train» — Duke Ellington
"""

  [[lessons.steps.tables]]
  headers = ["Тональность","ii", "V", "I"]
  align = ["center", "center", "center",]
  rows = [
      ["C (До мажор)","Dm", "G", "C",],
      ["G (Соль мажор)","Am", "D", "G",],
      ["F (Фа мажор)","Gm", "C", "F",],
  ]

  [[lessons.steps]]
    text = """
Блюзовая прогрессия (12-тактовый блюз)

Классическая структура блюза, основа рок-н-ролла.

| I   | I   | I   | I   |
| IV  | IV  | I   | I   |
| V   | IV  | I   | V   |


В тональности E:

| E   | E   | E   | E   |
| A   | A   | E   | E   |
| B   | A   | E   | B   |


Примеры песен:
- «Johnny B. Goode» — Chuck Berry
- «Pride and Joy» — Stevie Ray Vaughan
- «Rock and Roll» — Led Zeppelin
- «Hound Dog» — Elvis Presley
"""

  [[lessons.steps]]
    text = """

I — IV — vi — V (Вариация поп-прогрессии)

Альтернативный порядок с более плавным движением.

Примеры песен:
- «Boulevard of Broken Dreams» — Green Day
- «She Will Be Loved» — Maroon 5
- «Poker Face» — Lady Gaga
"""
  [[lessons.steps.tables]]
  headers = ["Тональность","I", "IV", "VШ","V"]
  align = ["center", "center", "center", "center"]
  rows = [
      ["C (До мажор)","C", "F", "Am", "G"],
      ["G (Соль мажор)","G", "G", "Em","D"],
  ]

  [[lessons.steps]]
    text = """
vi — V — IV — V (Андалузская каденция)

Драматичная последовательность с испанским колоритом.

| Тональность | vi | V | IV | V |
|:-----------:|:---:|:---:|:---:|:---:|
| Am | Am | G | F | G |
| Em | Em | D | C | D |

**Примеры песен:**
- «Stairway to Heaven» — Led Zeppelin (куплет)
- «All Along the Watchtower» — Jimi Hendrix
- «Exodus» (главная тема)

---

## 9. I — vii° — vi — V (Нисходящая басовая линия)

Создаёт эффект «спада», часто используется в балладах.

| Тональность | I | vii° | vi | V |
|:-----------:|:---:|:----:|:---:|:---:|
| C | C | Bdim | Am | G |
| G | G | F#dim | Em | D |

**Примеры песен:**
- «My Funny Valentine» (фрагменты)
- «While My Guitar Gently Weeps» — The Beatles

---

## 10. Canon Progression (I — V — vi — iii — IV — I — IV — V)

Прогрессия из «Канона» Пахельбеля, очень популярна в поп-музыке.

| Тональность | I | V | vi | iii | IV | I | IV | V |
|:-----------:|:---:|:---:|:---:|:---:|:---:|:---:|:---:|:---:|
| D | D | A | Bm | F#m | G | D | G | A |

**Примеры песен:**
- «Basket Case» — Green Day
- «Go Your Own Way» — Fleetwood Mac
- «Don't Look Back in Anger» — Oasis
- «Mama Do» — Pixie Lott
  """

