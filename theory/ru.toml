description = "Технические приёмы в нотах: легато, слайд, бенд"
image       = "lessons/img/techniques.png"

  [[lessons.steps]]
  text = "Легато (связанная игра):\n  h (hammer-on) — легато вверх: E|---0h2---| (1-й лад → 2-й лад ударом пальца)\n  p (pull-off) — легато вниз: E|---2p0---| (2-й лад → 1-й лад срывом пальца)"

    [[lessons.steps.images]]
    path    = "lessons/img/techniques.png"
    x       = 0.55
    y       = 0.14
    w       = 0.38
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "Другие приёмы:\n  /  — слайд вверх:    E|---5/7---|\n  \\ — слайд вниз:     E|---7\\5---|\n  b  — бенд (подтяжка): E|---7b9---|\n  ~  — вибрато:       E|---7~~~~---|\n  P.M. — глушение ладонью (palm mute)"

# ─── Урок 10 ──────────────────────────────────────────────────────────────────
[[lessons]]
id          = "sight_reading"
title       = "Чтение с листа — практика"
description = "Как научиться читать ноты с листа"
image       = "lessons/img/sight_reading.png"

  [[lessons.steps]]
  text = "Алгоритм чтения:\n  1. Определите тональность (ключевые знаки)\n  2. Найдите позицию (если указана)\n  3. Прочитайте ритм (длительности)\n  4. Найдите ноты на грифе (выберите удобное место)\n  5. Играйте медленно (постепенно ускоряя)"

    [[lessons.steps.images]]
    path    = "lessons/img/sight_reading.png"
    x       = 0.55
    y       = 0.14
    w       = 0.38
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "Упражнения для чтения с листа:\n\nУровень 1 — Открытые позиции:\n  ♩    ♩    ♩    ♩\nE|---0---1---3---0---|\n   0    1    3    0"

  [[lessons.steps]]
  text = "Уровень 2 — Первая позиция:\n  ♩    ♩    ♩    ♩\nE|---1---3---1---0---|\n   1    3    1    0\n\nУровень 3 — Пятая позиция:\n  ♩    ♩    ♩    ♩\nE|---5---7---8---5---|\n   5    7    8    5"

  [[lessons.steps]]
  text = "Рекомендуемые сборники для практики:\n  • Фернандо Сор — 20 этюдов для начинающих\n  • Маттео Каркасси — 25 мелодичных этюдов\n  • Мауро Джулиани — 120 арпеджио\n  • Агустио Барриос — простые пьесы"

# ─── Урок 11 ──────────────────────────────────────────────────────────────────
[[lessons]]
id          = "scales_guitar"
title       = "Гаммы на гитаре"
description = "Гаммы — основа техники"
image       = "lessons/img/scales.png"

  [[lessons.steps]]
  text = "Гамма До мажор (C) в первой позиции:\nE|---0---1---3---|\nB|---0---1---3---|\nG|---0---2---x---|\nD|---0---2---3---|\nA|---0---2---3---|\nE|---x---x---x---|"

    [[lessons.steps.images]]
    path    = "lessons/img/scales.png"
    x       = 0.55
    y       = 0.14
    w       = 0.38
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "Формула мажорной гаммы:\nТ-Т-П-Т-Т-Т-П\n(Тон-Тон-Полутон-Тон-Тон-Тон-Полутон)"

  [[lessons.steps]]
  text = "Паттерны гамм:\n\nПаттерн 1 (3 ноты на струне):\nE|---5---7---8---|\nB|---5---7---8---|\nG|---4---5---7---|\nD|---5---7---9---|\nA|---5---7---9---|\nE|---5---7---8---|"

  [[lessons.steps]]
  text = "Паттерн 2 (4 ноты на струне):\nE|---5---7---8---10--|\nB|---5---7---8---10--|\nG|---5---7---9---x---|\nD|---5---7---9---10--|\nA|---5---7---9---10--|\nE|---5---7---8---10--|"

# ─── Урок 12 ──────────────────────────────────────────────────────────────────
[[lessons]]
id          = "intervals_guitar"
title       = "Интервалы на гитаре"
description = "Расстояния между нотами на грифе"
image       = "lessons/img/intervals_guitar.png"

  [[lessons.steps]]
  text = "Интервалы на одной струне:\n  Прима          = 0 полутонов (0 ладов)\n  Малая секунда  = 1 полутон (1 лад)\n  Большая секунда = 2 полутона (2 лада)\n  Малая терция   = 3 полутона (3 лада)\n  Большая терция = 4 полутона (4 лада)\n  Кварта         = 5 полутонов (5 ладов)\n  Тритон         = 6 полутонов (6 ладов)\n  Квинта         = 7 полутонов (7 ладов)\n  Октава         = 12 полутонов (12 ладов)"

    [[lessons.steps.images]]
    path    = "lessons/img/intervals_guitar.png"
    x       = 0.55
    y       = 0.15
    w       = 0.38
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "Интервалы на соседних струнах:\n\nПравило:\n  • Между 6-3 струнами: интервал = разница ладов + 5\n  • Между 2-1 струнами: интервал = разница ладов + 4\n\nПример — квинта (7 полутонов):\n  6-я струна, 5-й лад (A)\n  5-я струна, 7-й лад (E)\n  = квинта (A → E)"

# ─── Урок 13 ──────────────────────────────────────────────────────────────────
[[lessons]]
id          = "chords_fretboard"
title       = "Аккорды по всему грифу"
description = "Система CAGED — аккорды в разных позициях"
image       = "lessons/img/caged_system.png"

  [[lessons.steps]]
  text = "CAGED — система 5 основных форм аккордов:\n  C (До)   — форма аккорда C\n  A (Ля)   — форма аккорда A\n  G (Соль) — форма аккорда G\n  E (Ми)   — форма аккорда E\n  D (Ре)   — форма аккорда D"

    [[lessons.steps.images]]
    path    = "lessons/img/caged_system.png"
    x       = 0.55
    y       = 0.14
    w       = 0.38
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "Как использовать CAGED:\n  • Форма аккорда C, сдвинутая на 3 лада = аккорд Eb\n  • Форма аккорда A, сдвинутая на 5 ладов = аккорд D\n  • И так далее..."

  [[lessons.steps]]
  text = "Пример — аккорд G (Соль мажор) в 5 позициях:\n\nФорма C (3-й лад):\nE|---3---|\nB|---0---|\nG|---0---|\nD|---0---|\nA|---2---|\nE|---3---|"

# ─── Урок 14 ──────────────────────────────────────────────────────────────────
[[lessons]]
id          = "practice_tips"
title       = "Практические советы"
description = "Как эффективно учить теорию"
image       = "lessons/img/practice_tips.png"

  [[lessons.steps]]
  text = "Ежедневная практика (15-20 минут):\n  • 5 минут — чтение нот\n  • 5 минут — гаммы\n  • 5 минут — аккорды\n  • 5 минут — пьесы"

    [[lessons.steps.images]]
    path    = "lessons/img/practice_tips.png"
    x       = 0.55
    y       = 0.14
    w       = 0.38
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "Используйте метроном:\n  • Начинайте с 60 BPM\n  • Увеличивайте на 5 BPM, когда всё получается\n  • Играйте ровно!"

  [[lessons.steps]]
  text = "Записывайте себя:\n  • Слушайте со стороны\n  • Ищите ошибки в ритме\n  • Оценивайте чистоту звука"

  [[lessons.steps]]
  text = "Чек-лист для самопроверки:\n  ✅ Знаю все ноты на 1-й и 6-й струнах\n  ✅ Могу найти любую ноту на грифе\n  ✅ Читаю простые ноты с листа (60 BPM)\n  ✅ Знаю основные аккорды (C, D, E, G, A, Am, Em, Dm)\n  ✅ Понимаю разницу между нотами и TAB\n  ✅ Могу играть гамму До мажор по всему грифу\n  ✅ Знаю систему CAGED\n  ✅ Понимаю интервалы на грифе"

