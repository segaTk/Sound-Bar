  [[lessons.steps]]
  text = "Ритмическое упражнение 2 — Восьмые ноты:\n  ♪ ♪  ♪ ♪  ♪ ♪  ♪ ♪\nE|-0-0--0-0--0-0--0-0-|\n   1 и  2 и  3 и  4 и"

  [[lessons.steps]]
