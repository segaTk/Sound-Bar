# ─── Урок 7 ───────────────────────────────────────────────────────────────────
[[lessons]]
id          = "accidentals_guitar"
title       = "Знаки альтерации на гитаре"
description = "Диезы и бемоли на грифе"
image       = "lessons/img/accidentals.png"

  [[lessons.steps]]
  text = "Правило:\n  • Диез (♯) = следующий лад (+1)\n  • Бемоль (♭) = предыдущий лад (-1)\n\nПример:\n  Фа (F) = 1-я струна, 1-й лад\n  Фа# (F#) = 1-я струна, 2-й лад\n  Соль♭ (Gb) = 1-я струна, 2-й лад (то же, что Фа#)"

    [[lessons.steps.images]]
    path    = "lessons/img/accidentals.png"
    x       = 0.56
    y       = 0.15
    w       = 0.36
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "Энгармонизм на гитаре — один и тот же звук, разные названия:\n  1-й лад (1-я струна): Фа (F) или Ми# (E#)\n  2-й лад (1-я струна): Фа# (F#) или Соль♭ (Gb)\n  3-й лад (1-я струна): Соль (G) или Фа× (F×)"

  [[lessons.steps]]
  text = "Ключевые знаки в гитарной музыке. Пример тональности G (Соль мажор) — один диез Фа#:\n\nВсе Фа в произведении автоматически становятся Фа#, если нет бекара (♮)"

