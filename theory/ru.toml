# ─── Урок 2 ───────────────────────────────────────────────────────────────────
[[lessons]]
id          = "guitar_staff"
title       = "Гитарный нотный стан"
description = "Как читать ноты для гитары: скрипичный ключ и диапазон"
image       = "lessons/img/guitar_staff.png"

  [[lessons.steps]]
  text = "Скрипичный ключ — основной для гитары. Нотный стан состоит из 5 линий. Диапазон гитары: от Ми большой октавы (6-я открытая) до Ми третьей октавы (1-я, 12-й лад)."

    [[lessons.steps.images]]
    path    = "lessons/img/guitar_staff.png"
    x       = 0.54
    y       = 0.16
    w       = 0.40
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "Ноты на открытых струнах (от 6-й к 1-й):\n  6-я (самая толстая) — Ми (E)\n  5-я — Ля (A)\n  4-я — Ре (D)\n  3-я — Соль (G)\n  2-я — Си (B)\n  1-я (самая тонкая) — Ми (E)"

  [[lessons.steps]]
  text = "Мнемоника для запоминания:\n«Мама Асей Ребенка Снова Будет Мыть»"

# ─── Урок 3 ───────────────────────────────────────────────────────────────────
[[lessons]]
id          = "fretboard_notes"
title       = "Расположение нот на грифе"
description = "Как найти любую ноту на грифе гитары"
image       = "lessons/img/fretboard_notes.png"

  [[lessons.steps]]
  text = "Правило 12 ладов: на 12-м ладу ноты повторяются (октава выше). Каждый лад = 1 полутон. 1-й лад = открытая струна + 1 полутон."

    [[lessons.steps.images]]
    path    = "lessons/img/fretboard_notes.png"
    x       = 0.55
    y       = 0.15
    w       = 0.38
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "Таблица нот на 1-й струне (Ми):\n  Открытая: Ми (E)\n  1-й лад: Фа (F)\n  2-й лад: Фа# (F#)\n  3-й лад: Соль (G)\n  4-й лад: Соль# (G#)\n  5-й лад: Ля (A)\n  6-й лад: Ля# (A#)\n  7-й лад: Си (B)\n  8-й лад: До (C)\n  9-й лад: До# (C#)\n  10-й лад: Ре (D)\n  11-й лад: Ре# (D#)\n  12-й лад: Ми (E) — октава выше"

  [[lessons.steps]]
  text = "Практическое упражнение: найдите ноту 'Ля' (A) на грифе:\n  1. 5-я струна, открытый лад (основная)\n  2. 4-я струна, 2-й лад\n  3. 3-я струна, 7-й лад\n  4. 2-я струна, 10-й лад\n  5. 1-я струна, 5-й лад"

# ─── Урок 4 ───────────────────────────────────────────────────────────────────
[[lessons]]
id          = "tablature"
title       = "Табулатура (TAB)"
description = "Гитарная запись: как читать табы"
image       = "lessons/img/tab_example.png"

  [[lessons.steps]]
  text = "Табулатура — упрощённая запись для гитары, показывающая, где ставить пальцы. Цифры = номер лада (0 = открытая струна). x = струна не играет."

    [[lessons.steps.images]]
    path    = "lessons/img/tab_example.png"
    x       = 0.56
    y       = 0.15
    w       = 0.36
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "Как читать TAB:\n  E|---0---1---3---|  ← 1-я струна (самая тонкая)\n  B|---1---0---0---|  ← 2-я струна\n  G|---0---0---0---|  ← 3-я струна\n  D|---2---2---0---|  ← 4-я струна\n  A|---3---3---2---|  ← 5-я струна\n  E|---x---x---3---|  ← 6-я струна (самая толстая)"

  [[lessons.steps]]
  text = "Недостатки TAB:\n  ❌ Не показывает ритм (длительности нот)\n  ❌ Не показывает, каким пальцем играть\n  ❌ Не учит читать настоящие ноты\n\nРешение: использовать комбинированную запись (ноты + TAB)"

