# lessons/en.toml

section_title = "Guitar Lessons"

[[lessons]]
id          = "tuning"
title       = "Tuning the Guitar"
description = "Standard tuning E A D G B E and how to check with a tuner"
image       = "lessons/img/tuning_pegs.png"
 
  [[lessons.steps]]
  text = "Standard tuning (6th to 1st string): E2 — A2 — D3 — G3 — B3 — E4.\nMnemonic: \"Eddie Ate Dynamite, Good Bye Eddie\"."
 
    [[lessons.steps.images]]
    path    = "lessons/img/tuning_pegs.png"
    x       = 0.56
    y       = 0.15
    w       = 0.36
    alpha   = 1.0
    z_order = 0
 
  [[lessons.steps]]
  text = "Open the Tuner — it will detect the pitch of the string you play. Pluck the 6th (thickest) string; the tuner should show E2 (~82 Hz)."
 
    [[lessons.steps.links]]
    label  = "Open Tuner"
    target = "tuner"
 
    [[lessons.steps.images]]
    path    = "lessons/img/tuning_pegs.png"
    x       = 0.60
    y       = 0.20
    w       = 0.28
    alpha   = 0.80
    z_order = 0
 
  [[lessons.steps]]
  text = "If the needle drifts left — the string is flat; tighten the peg clockwise. Right — loosen it. Aim for center."
 
  [[lessons.steps]]
  text = "Repeat for each string:\n  A2  — 110 Hz\n  D3  — 147 Hz\n  G3  — 196 Hz\n  B3  — 247 Hz\n  E4  — 330 Hz"
 
[[lessons]]
id          = "practice_mode"
title       = "Practice Mode"
description = "How to use the game / practice mode"
 
  [[lessons.steps]]
  text = "In Practice mode, notes fly right-to-left into the HIT ZONE. Play the correct note on your guitar — the microphone detects the pitch and counts a hit."
 
    [[lessons.steps.links]]
    label  = "Go to Practice"
    target = "practice"
 
  [[lessons.steps]]
  text = "Controls:\n  M — microphone\n  S / W — speed (−/+)\n  P — pause\n  Z — auto-play\n  Esc — statistics"

  [[lessons.steps]]
  text = "Sit on a chair with your back straight. Rest the guitar's cutaway on your right thigh (for right-handers). The body tilts slightly toward you."

    [[lessons.steps.images]]
    path    = "lessons/img/posture_sit.png"
    x       = 0.55
    y       = 0.14
    w       = 0.38
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "The left hand wraps around the neck from below: thumb behind the middle of the neck, fingers hovering above the strings. The wrist must not touch the bottom edge of the neck."

    [[lessons.steps.images]]
    path    = "lessons/img/posture_sit.png"
    x       = 0.56
    y       = 0.14
    w       = 0.20
    alpha   = 0.60
    z_order = 0

    [[lessons.steps.images]]
    path    = "lessons/img/posture_hand.png"
    x       = 0.57
    y       = 0.38
    w       = 0.36
    alpha   = 1.0
    z_order = 1

  [[lessons.steps]]
  text = "The right hand rests freely on the body. Hold the pick between thumb and index finger at a 45° angle to the strings."

    [[lessons.steps.images]]
    path    = "lessons/img/posture_hand.png"
    x       = 0.58
    y       = 0.18
    w       = 0.34
    alpha   = 0.95
    z_order = 0

