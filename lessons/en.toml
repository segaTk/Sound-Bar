[[lessons]]
id          = "first_chords"
title       = "First Chords: Em and Am"
description = "The two simplest chords for beginners"
image       = "lessons/img/em_chord.png"

  [[lessons.steps]]
  text = "Em chord (E minor): press string 5 at fret 2 with your middle finger, string 4 at fret 2 with your ring finger. All 6 strings ring."

    [[lessons.steps.images]]
    path    = "lessons/img/em_chord.png"
    x       = 0.55
    y       = 0.14
    w       = 0.38
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "Am chord (A minor): string 2 — fret 1 with index, string 3 — fret 2 with middle, string 4 — fret 2 with ring. Strings 1–5 ring; mute string 6."

    [[lessons.steps.images]]
    path    = "lessons/img/am_chord.png"
    x       = 0.55
    y       = 0.14
    w       = 0.38
    alpha   = 1.0
    z_order = 0

  [[lessons.steps]]
  text = "Practice: switch Em → Am → Em repeatedly. Every note must ring clean — no muted or dead strings."

    [[lessons.steps.images]]
    path    = "lessons/img/em_chord.png"
    x       = 0.54
    y       = 0.16
    w       = 0.20
    alpha   = 0.95
    z_order = 0

    [[lessons.steps.images]]
    path    = "lessons/img/am_chord.png"
    x       = 0.76
    y       = 0.16
    w       = 0.20
    alpha   = 0.95
    z_order = 0

